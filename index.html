<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>萬聖節 AR 抓寶大冒險</title>

  <!-- 載入 HTML5 QR Code 掃瞄器 -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- 載入 A-Frame (WebVR/AR 框架) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    :root {
      --primary-color: #ff7518;
      --secondary-color: #4b0082;
      --bg-color: #1a1a2e;
      --card-bg: #16213e;
      --text-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      color: var(--primary-color);
      font-size: 1.8rem;
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(255, 117, 24, 0.5);
    }

    .stamp-card {
      background: var(--card-bg);
      border: 3px solid var(--primary-color);
      border-radius: 15px;
      padding: 20px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      margin-bottom: 25px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .stamp-slot {
      aspect-ratio: 1;
      background: rgba(255,255,255,0.05);
      border: 2px dashed #555;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      position: relative;
      transition: all 0.3s ease;
    }

    .stamp-slot.collected {
      border-style: solid;
      border-color: var(--primary-color);
      background: rgba(255, 117, 24, 0.15);
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .stamp-slot .monster-name {
      font-size: 0.65rem;
      color: #aaa;
      margin-top: 2px;
    }

    .btn {
      background: linear-gradient(135deg, #ff7518, #e65c00);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 117, 24, 0.4);
      transition: transform 0.2s, background 0.2s;
      width: 80%;
      max-width: 300px;
      margin-bottom: 15px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-verify {
      background: linear-gradient(135deg, #8a2be2, var(--secondary-color));
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
      display: none;
    }

    .btn-reset {
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
      box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4);
      display: none;
    }

    /* 全螢幕 Overlay */
    .fullscreen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      height: 100%;
    }

    .overlay-header {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 101;
    }

    .close-btn {
      background: rgba(0,0,0,0.6);
      color: white;
      border: 1px solid #fff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* AR 相機視窗與捕捉控制項 */
    #ar-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: none;
    }

    #ar-video-feed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
    }

    .ar-ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 102;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      padding-bottom: 40px;
    }

    .ar-info-box {
      margin-top: 80px;
      background: rgba(0, 0, 0, 0.65);
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid var(--primary-color);
      text-align: center;
      backdrop-filter: blur(5px);
    }

    .ball-container {
      pointer-events: auto;
      cursor: pointer;
    }

    .pumpkin-ball {
      font-size: 4.5rem;
      filter: drop-shadow(0 0 12px rgba(255,117,24,0.9));
      transition: transform 0.2s ease;
    }

    .pumpkin-ball.throw {
      animation: throwBall 0.8s forwards ease-out;
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-content {
      background: var(--card-bg);
      border: 2px solid var(--primary-color);
      border-radius: 15px;
      padding: 25px;
      width: 85%;
      max-width: 360px;
      text-align: center;
    }

    .modal-content input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 8px;
      border: 1px solid #444;
      background: #0f172a;
      color: #fff;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 5px;
    }

    @keyframes throwBall {
      0% { transform: translateY(0) scale(1) rotate(0deg); }
      50% { transform: translateY(-300px) scale(0.6) rotate(360deg); }
      100% { transform: translateY(-450px) scale(0) rotate(720deg); opacity: 0; }
    }

    @keyframes pop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- 主頁集點卡 -->
  <div class="container">
    <header>
      <h1>🎃 萬聖抓寶大冒險 (AR版) 👻</h1>
      <p>開啟相機實景尋找 8 隻萬聖小怪物！</p>
    </header>

    <div class="stamp-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>我的集點卡</h3>
        <span id="progress-text" style="color: var(--primary-color); font-weight: bold;">0 / 8</span>
      </div>
      <div class="grid" id="stamp-grid"></div>
    </div>

    <!-- 功能按鈕區 -->
    <button class="btn" id="start-btn" onclick="openScanner()">開啟 AR 掃瞄器 🔍</button>
    <button class="btn btn-verify" id="verify-btn" onclick="openVerifyModal()">出示換領小禮物 🎁</button>
    <button class="btn btn-reset" id="reset-btn" onclick="confirmResetGame()">再玩一次 ↺</button>
  </div>

  <!-- 全螢幕 AR / 掃描 Overlay -->
  <div class="fullscreen-overlay" id="game-overlay">
    <div class="overlay-header">
      <span style="font-weight: bold; background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 15px;">
        <span id="overlay-title">掃描地點 QR Code</span>
      </span>
      <button class="close-btn" onclick="closeOverlay()">✕</button>
    </div>

    <!-- 步驟 1：QR Code 掃描器 -->
    <div id="reader"></div>

    <!-- 步驟 2：AR 相機與 3D 浮動怪物畫布 -->
    <div id="ar-stage">
      <video id="ar-video-feed" autoplay playsinline muted></video>
      
      <!-- A-Frame 3D AR 場景 -->
      <a-scene embedded vr-mode-ui="enabled: false" style="width: 100%; height: 100%; position: absolute;">
        <a-entity id="ar-monster-entity" position="0 0.2 -2.2" animation="property: position; dir: alternate; dur: 1500; easing: easeInOutSine; loop: true; to: 0 0.4 -2.2">
          <!-- 改用 3D Plane 搭配 Canvas 生成的動態貼圖呈現怪物 -->
          <a-plane id="ar-monster-plane" width="1.8" height="1.8" material="transparent: true; shader: flat;" look-at="[a-camera]"></a-plane>
        </a-entity>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      </a-scene>

      <!-- UI 圖層 (丟南瓜球) -->
      <div class="ar-ui-layer">
        <div class="ar-info-box">
          <p style="font-size: 1.1rem; font-weight: bold;" id="monster-name-tag">野生怪物現身中...</p>
          <p style="font-size: 0.8rem; color: #ddd; margin-top: 3px;">對準相機中的怪物，點擊南瓜球收服！</p>
        </div>

        <div class="ball-container" onclick="throwPumpkinBall()">
          <div class="pumpkin-ball" id="pumpkin-ball">🎃</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 工作人員核銷 Modal -->
  <div class="modal" id="verify-modal">
    <div class="modal-content">
      <h3>🎁 兌換萬聖小禮物</h3>
      <p style="font-size: 0.85rem; color: #aaa; margin-top: 5px;">請交由服務台工作人員操作</p>
      <input type="password" id="passcode" maxlength="4" placeholder="輸入核銷碼">
      <div style="display: flex; gap: 10px;">
        <button class="btn" style="width: 50%; background: #555;" onclick="closeVerifyModal()">取消</button>
        <button class="btn" style="width: 50%;" onclick="confirmRedeem()">確認核銷</button>
      </div>
    </div>
  </div>

  <script>
    const MONSTERS = [
      { id: 'spot_1', name: '南瓜怪', icon: '🎃' },
      { id: 'spot_2', name: '淘氣幽靈', icon: '👻' },
      { id: 'spot_3', name: '小吸血鬼', icon: '🦇' },
      { id: 'spot_4', name: '骷髏人', icon: '💀' },
      { id: 'spot_5', name: '萬聖蜘蛛', icon: '🕷️' },
      { id: 'spot_6', name: '黑貓精靈', icon: '🐈‍⬛' },
      { id: 'spot_7', name: '魔法飛掃', icon: '🧹' },
      { id: 'spot_8', name: '糖果怪人', icon: '🍬' }
    ];

    const STAFF_PASSCODE = "1031";

    let collectedSet = new Set(JSON.parse(localStorage.getItem('halloween_stamps') || '[]'));
    let isRedeemed = localStorage.getItem('halloween_redeemed') === 'true';
    let html5QrcodeScanner = null;
    let currentTargetMonster = null;
    let isBallThrowing = false;
    let cameraStream = null;

    function init() {
      renderStamps();
      updateProgress();
    }

    function renderStamps() {
      const grid = document.getElementById('stamp-grid');
      grid.innerHTML = '';

      MONSTERS.forEach((m, index) => {
        const isCollected = collectedSet.has(m.id);
        const slot = document.createElement('div');
        slot.className = `stamp-slot ${isCollected ? 'collected' : ''}`;
        slot.innerHTML = `
          <span>${isCollected ? m.icon : '❓'}</span>
          <span class="monster-name">${isCollected ? m.name : `關卡 ${index + 1}`}</span>
        `;
        grid.appendChild(slot);
      });
    }

    function updateProgress() {
      const count = collectedSet.size;
      document.getElementById('progress-text').innerText = `${count} / ${MONSTERS.length}`;

      const startBtn = document.getElementById('start-btn');
      const verifyBtn = document.getElementById('verify-btn');
      const resetBtn = document.getElementById('reset-btn');

      if (isRedeemed) {
        startBtn.style.display = 'none';
        verifyBtn.style.display = 'none';
        resetBtn.style.display = 'block';
      } else if (count >= MONSTERS.length) {
        startBtn.style.display = 'none';
        verifyBtn.style.display = 'block';
        resetBtn.style.display = 'none';
      } else {
        startBtn.style.display = 'block';
        verifyBtn.style.display = 'none';
        resetBtn.style.display = 'none';
      }
    }

    function openScanner() {
      document.getElementById('game-overlay').style.display = 'flex';
      document.getElementById('reader').style.display = 'block';
      document.getElementById('ar-stage').style.display = 'none';
      document.getElementById('overlay-title').innerText = '掃描地點 QR Code';

      html5QrcodeScanner = new Html5Qrcode("reader");
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        onScanFailure
      ).catch(err => {
        alert("無法存取相機，請確認瀏覽器相機權限設定。");
        closeOverlay();
      });
    }

    function onScanSuccess(decodedText) {
      const foundMonster = MONSTERS.find(m => m.id === decodedText || decodedText.includes(m.id));

      if (!foundMonster) {
        alert("這不是萬聖節關卡的 QR Code 哦！");
        return;
      }

      if (collectedSet.has(foundMonster.id)) {
        alert(`你已經收服過 ${foundMonster.name} 了！`);
        return;
      }

      html5QrcodeScanner.stop().then(() => {
        currentTargetMonster = foundMonster;
        startARCamera();
      });
    }

    function onScanFailure(error) {}

    // 使用 Canvas 動態生成帶有發光效果與 Emoji 的圖片 Texture
    function createMonsterTexture(emoji) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // 背景放射光芒效果
      const gradient = ctx.createRadialGradient(256, 256, 10, 256, 256, 240);
      gradient.addColorStop(0, 'rgba(255, 117, 24, 0.6)');
      gradient.addColorStop(0.5, 'rgba(138, 43, 226, 0.3)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(256, 256, 240, 0, Math.PI * 2);
      ctx.fill();

      // 繪製 Emoji 怪物文字
      ctx.font = '260px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, 256, 260);

      return canvas.toDataURL();
    }

    async function startARCamera() {
      document.getElementById('reader').style.display = 'none';
      document.getElementById('ar-stage').style.display = 'block';
      document.getElementById('overlay-title').innerText = 'AR 抓寶中 👻';
      document.getElementById('monster-name-tag').innerText = `【${currentTargetMonster.name}】出現在你面前了！`;

      // 產生貼圖並綁定到 A-Frame 3D 平面上
      const monsterTextureUrl = createMonsterTexture(currentTargetMonster.icon);
      const monsterPlane = document.getElementById('ar-monster-plane');
      monsterPlane.setAttribute('material', `src: ${monsterTextureUrl}; transparent: true; shader: flat;`);

      // 重置 3D 怪物大小與狀態
      const monsterEntity = document.getElementById('ar-monster-entity');
      monsterEntity.setAttribute('scale', '1 1 1');

      const ball = document.getElementById('pumpkin-ball');
      ball.classList.remove('throw');
      isBallThrowing = false;

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        const videoElement = document.getElementById('ar-video-feed');
        videoElement.srcObject = cameraStream;
      } catch (err) {
        console.error("相機開啟失敗:", err);
      }
    }

    function throwPumpkinBall() {
      if (isBallThrowing) return;
      isBallThrowing = true;

      const ball = document.getElementById('pumpkin-ball');
      const monsterEntity = document.getElementById('ar-monster-entity');

      ball.classList.add('throw');

      setTimeout(() => {
        monsterEntity.setAttribute('animation__shrink', 'property: scale; to: 0 0 0; dur: 400; easing: easeInBack');
      }, 350);

      setTimeout(() => {
        alert(`🎉 恭喜！成功在 AR 實景中收服【${currentTargetMonster.name}】！`);
        
        collectedSet.add(currentTargetMonster.id);
        localStorage.setItem('halloween_stamps', JSON.stringify([...collectedSet]));

        monsterEntity.removeAttribute('animation__shrink');

        stopARCamera();
        closeOverlay();
        renderStamps();
        updateProgress();
      }, 1000);
    }

    function stopARCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
    }

    function closeOverlay() {
      if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
        html5QrcodeScanner.stop().catch(() => {});
      }
      stopARCamera();
      document.getElementById('game-overlay').style.display = 'none';
    }

    function openVerifyModal() {
      document.getElementById('verify-modal').style.display = 'flex';
    }

    function closeVerifyModal() {
      document.getElementById('verify-modal').style.display = 'none';
      document.getElementById('passcode').value = '';
    }

    function confirmRedeem() {
      const code = document.getElementById('passcode').value;
      if (code === STAFF_PASSCODE) {
        alert("核銷成功！請領取您的萬聖節小禮物 🎁");
        isRedeemed = true;
        localStorage.setItem('halloween_redeemed', 'true');
        closeVerifyModal();
        updateProgress();
      } else {
        alert("核銷密碼錯誤，請洽現場工作人員！");
      }
    }

    function confirmResetGame() {
      if (confirm("確定要重置集點卡重新開始遊戲嗎？")) {
        localStorage.removeItem('halloween_stamps');
        localStorage.removeItem('halloween_redeemed');
        collectedSet.clear();
        isRedeemed = false;
        
        renderStamps();
        updateProgress();
        alert("集點卡已重置，可以再次開始抓寶囉！🎃");
      }
    }

    init();
  </script>
</body>
</html>
